name: Bug report
description: Report an export failure, incorrect transcript, or CLI problem.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not paste sensitive chat exports without reviewing or redacting them first.
  - type: input
    id: version
    attributes:
      label: codex-chat-export version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex CLI version
      placeholder: "codex --version"
  - type: dropdown
    id: format
    attributes:
      label: Output mode
      options:
        - Markdown
        - Text
        - JSON
        - Bundle
        - List
        - Other
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Redact local paths or sensitive arguments if needed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Attach a minimal redacted fixture if possible.
